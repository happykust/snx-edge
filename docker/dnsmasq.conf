# snx-edge in-container split-DNS forwarder (dnsmasq).
#
# RouterOS dst-nats VPN/LAN clients' :53 to this container, where dnsmasq
# answers: corp-internal domains are forwarded to the corp DNS servers
# (reachable through the tunnel), everything else goes to the fallback upstream
# below. This base file is static; the per-corp-domain upstreams are written at
# runtime (see servers-file).

# Resolve only from the upstreams configured here — never /etc/resolv.conf.
no-resolv
# Do not serve names from /etc/hosts.
no-hosts

# Bind only the interfaces we listen on (works cleanly inside a container).
bind-interfaces
listen-address=0.0.0.0

# Per-corp-domain upstreams (`server=/<domain>/<corp-dns>`) are written here at
# runtime by snx-edge-server from the tunnel's ConnectionInfo, then dnsmasq is
# reloaded with SIGHUP. A servers-file is used (not a conf-dir drop-in) because
# dnsmasq RE-READS a servers-file on SIGHUP, whereas `server=` directives in a
# conf-dir are NOT re-read on SIGHUP. The path lives under /var/lib/snx-edge,
# which the init script chowns to the snxedge user so the server can write it.
servers-file=/var/lib/snx-edge/corp-servers.conf

# Pidfile so snx-edge-server can find us to SIGHUP for a servers-file reload.
pid-file=/run/dnsmasq.pid

# Fallback upstream for all NON-corp names. The operator may change this to the
# router itself or another public/internal resolver.
server=1.1.1.1
