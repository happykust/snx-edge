name: Release

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/snx-edge-server

jobs:
  build:
    name: Cross-compile (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross@0.2.5 --locked

      - name: Build with cross
        run: cross build --release -p snx-edge-server --target ${{ matrix.target }} --features snx-edge-server/vendored-openssl

      - name: Rename binary
        run: |
          cp target/${{ matrix.target }}/release/snx-edge-server \
             snx-edge-server-linux-${{ matrix.arch }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: snx-edge-server-linux-${{ matrix.arch }}
          path: snx-edge-server-linux-${{ matrix.arch }}

  licenses:
    name: Generate third-party license report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-about
        # Pinned to keep license report generation reproducible across runs.
        run: cargo install cargo-about --version 0.6.6 --locked

      - name: Generate THIRD-PARTY-LICENSES.html
        run: cargo about generate -c about.toml about.hbs -o THIRD-PARTY-LICENSES.html

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: THIRD-PARTY-LICENSES.html

  docker:
    name: Docker (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [build, licenses]
    permissions:
      contents: read
      packages: write
      # Required for cosign keyless signing and SLSA build provenance.
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64

    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: snx-edge-server-linux-${{ matrix.arch }}

      - name: Download license report
        uses: actions/download-artifact@v4
        with:
          name: third-party-licenses

      - name: Prepare binary
        run: |
          mv snx-edge-server-linux-${{ matrix.arch }} snx-edge-server
          chmod +x snx-edge-server

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        env:
          GITHUB_REF: ${{ github.ref }}
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.release
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Resolve image reference
        id: image
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-${{ matrix.arch }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "digest=${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (CycloneDX)
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          syft "${IMAGE_REF}@${IMAGE_DIGEST}" \
            -o "cyclonedx-json=sbom-${ARCH}.cdx.json"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.ref_name }}-${{ matrix.arch }}
          path: sbom-${{ matrix.arch }}.cdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless via OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE_REF}@${IMAGE_DIGEST}"

      - name: Attest SLSA build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  manifest:
    name: Create multi-arch manifest
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      packages: write

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version
        id: version
        env:
          GITHUB_REF: ${{ github.ref }}
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create and push manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          docker buildx imagetools create \
            -t "${REGISTRY}/${IMAGE_NAME}:${VERSION}" \
            -t "${REGISTRY}/${IMAGE_NAME}:latest" \
            "${REGISTRY}/${IMAGE_NAME}:${VERSION}-amd64" \
            "${REGISTRY}/${IMAGE_NAME}:${VERSION}-arm64"

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, licenses]
    permissions:
      contents: write
      # Required for sigstore-python keyless signing of release artifacts.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files
        run: |
          mkdir -p release
          cp artifacts/snx-edge-server-linux-amd64/snx-edge-server-linux-amd64 release/
          cp artifacts/snx-edge-server-linux-arm64/snx-edge-server-linux-arm64 release/
          cp artifacts/third-party-licenses/THIRD-PARTY-LICENSES.html release/
          ls -la release/

      - name: Generate SHA256SUMS
        working-directory: release
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Sign binaries via sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: |
            release/snx-edge-server-linux-amd64
            release/snx-edge-server-linux-arm64
            release/SHA256SUMS

      - name: Create release with binaries
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/snx-edge-server-linux-amd64
            release/snx-edge-server-linux-arm64
            release/THIRD-PARTY-LICENSES.html
            release/SHA256SUMS
            release/*.sig
            release/*.sigstore
            release/*.crt
