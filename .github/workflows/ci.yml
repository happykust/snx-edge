name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libdbus-1-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libdbus-1-dev

      - name: Run tests
        run: cargo test --workspace

  coverage:
    # Establishes a baseline coverage report. We do not enforce a minimum
    # threshold yet — the goal at this stage is visibility (Codecov diff
    # views, treemap) so we know which crates are under-tested. A
    # `--fail-under-lines` gate will be added as a follow-up once the
    # baseline numbers stabilise.
    name: Coverage
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libdbus-1-dev

      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          # Codecov uploads sometimes flake on token/network issues; the
          # report is informational at this stage so don't fail CI on it.
          fail_ci_if_error: false

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # rustsec/audit-check fails the job on any advisory not present in the
      # ignore list of deny.toml. The previous configuration left the step in
      # non-failing mode; this version is a hard gate.
      - name: cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: cargo deny check
        run: cargo deny check

  build-server:
    name: Build Server (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.5

      - name: Build
        run: cross build --release --target ${{ matrix.target }} -p snx-edge-server --features snx-edge-server/vendored-openssl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: snx-edge-server-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/snx-edge-server

  docker-build:
    # Catches Dockerfile bugs at PR time instead of release time. Builds both
    # the dev image (native arch) and the release image (multi-arch via
    # buildx) without pushing.
    name: Docker build (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: build-server
    steps:
      - uses: actions/checkout@v4

      - name: Download amd64 artifact (for release Dockerfile context)
        uses: actions/download-artifact@v4
        with:
          name: snx-edge-server-amd64
          path: ./

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image
        run: docker build -f docker/Dockerfile -t snx-edge:pr-test .

      - name: Build release image (no push, multi-arch)
        # Release image expects `snx-edge-server` and `THIRD-PARTY-LICENSES.html`
        # next to the Dockerfile context root. Stub the license file so PR
        # builds don't require a full cargo-about run.
        run: |
          chmod +x snx-edge-server
          echo "<!-- placeholder for PR build only -->" > THIRD-PARTY-LICENSES.html
          docker buildx build \
            -f docker/Dockerfile.release \
            --platform linux/amd64,linux/arm64 \
            .
