# cargo-about configuration. Generates THIRD-PARTY-LICENSES.html which is
# bundled into the release container and uploaded as a release artifact.
# See `release.yml` job `licenses`.

# Licenses we accept for redistribution alongside the AGPL-3.0 binary.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "AGPL-3.0",
    "AGPL-3.0-or-later",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
    "WTFPL",
    "CDLA-Permissive-2.0",
]

# OpenSSL: ring exposes a non-standard composite license; widely accepted in
# the Rust ecosystem and matched in deny.toml.
[ring]
accepted = ["OpenSSL", "ISC", "MIT"]
