[workspace]
members = [
    "apps/snx-edge-types",
    "apps/snx-edge-server",
    "apps/snx-edge-client",
    "apps/snx-edge-ctl",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0"
repository = "https://github.com/happykust/snx-edge"
homepage = "https://github.com/happykust/snx-edge"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Web framework
axum = { version = "0.8", features = ["macros", "multipart"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower_governor = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.25"

# Auth
jsonwebtoken = "9"
bcrypt = "0.19"

# Database
rusqlite = { version = "0.39", features = ["bundled", "uuid"] }

# HTTP client (for RouterOS)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Streaming
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"

# GUI (client only)
gtk4 = { version = "0.11", features = ["v4_12"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
ksni = "0.3"
reqwest-eventsource = "0.6"
keyring = { version = "3", features = ["sync-secret-service"] }

# TLS / mTLS.
#
# `ring` is selected explicitly on every rustls-facing crate: rustls refuses to
# choose when several providers are compiled in, and `aws-lc-rs` needs a C
# toolchain per target, which is exactly what breaks armv7-musl cross builds.
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Pinned to >=0.103.13 to address RUSTSEC-2026-0098/0099/0104 (name constraint
# bypass and reachable panic in CRL parsing). Forced via direct workspace dep
# because the transitive `rustls 0.23` did not pull a fixed version.
rustls-webpki = { version = "0.103.13", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

# Secrets
secrecy = "0.10"
chacha20poly1305 = "0.10"

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
base64 = "0.22"
dirs-next = "2"
clap = { version = "4", features = ["derive"] }
tabled = "0.20"
rpassword = "7"

# VPN core. Pinned to a specific commit — supply-chain integrity requires that
# `cargo update` cannot silently advance to upstream HEAD.
snxcore = { git = "https://github.com/ancwrd1/snx-rs.git", rev = "265265148485f1631116753c1aa9d83053bc3ae9" }

# Dev-only dependencies. Cargo's manifest format collapses dev/build/runtime
# deps under a single `[workspace.dependencies]` table — crates opt in via
# `[dev-dependencies] foo.workspace = true` so versions stay synchronized.
wiremock = "0.6"
proptest = "1"
assert_cmd = "2"
predicates = "3"
serial_test = "3"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
strip = true
panic = 'abort'
